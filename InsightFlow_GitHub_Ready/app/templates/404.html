{% extends "base.html" %}

{% block title %}Page Not Found (404) — InsightFlow{% endblock %}

{% block content %}
<div class="stat-card" style="text-align: center; padding: 70px 20px; max-width: 600px; margin: 40px auto;">
  <div style="font-size: 64px; font-weight: 900; color: var(--primary-purple); line-height: 1; margin-bottom: 12px;">404</div>
  <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Resource Not Found</h2>
  <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
    The dashboard view or dataset you requested does not exist or has been relocated.
  </p>
  <a href="{{ url_for('analytics.dashboard') }}" class="btn-export">
    <i class="fa-solid fa-house"></i>
    <span>Return to Dashboard</span>
  </a>
</div>
{% endblock %}
